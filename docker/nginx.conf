server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend routes (SPA fallback)
    location / {
        try_files $uri $uri.html $uri/ @backend;
    }

    # Any non-static path is an API request. This keeps new backend routes from
    # silently falling through to index.html and crashing the frontend on HTML.
    location @backend {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        client_max_body_size 100M;
    }

    # Proxy API requests to backend
    location /projects {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        client_max_body_size 100M;
    }

    location /series {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        client_max_body_size 100M;
    }

    location /files/ {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
    }

    location /tasks/ {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
    }

    location /art_direction/ {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
    }

    location /upload {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
        client_max_body_size 100M;
    }

    location /video/ {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
    }

    location /voices {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
    }

    location /config/ {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
    }
}
