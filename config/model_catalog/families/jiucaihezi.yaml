  - id: jc-qwen-image-2.1
    display_name: "Qwen Image 2.1 · 本地"
    description: "文生图与最多 10 张参考图编辑，via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [t2i, i2i]
    docs: {official_snapshot_ids: [jiucaihezi/images], context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui: {selection_group: image, visible_in: [project_settings, series_settings, global_settings], order: 1003, recommended: true, badges: [本地, Qwen]}
    params:
      size:
        options: ["1024x1024", "1024x576", "576x1024", "1024x768", "768x1024", "1024x680", "680x1024", "1448x1448", "1920x1088", "1088x1920", "1664x1248", "1248x1664", "1768x1176", "1176x1768"]
        default: "1088x1920"
        # UI 只提交档位和比例；实际像素由后端按此表解析。
        presets:
          1K: {"1:1": "1024x1024", "16:9": "1024x576", "9:16": "576x1024", "4:3": "1024x768", "3:4": "768x1024", "3:2": "1024x680", "2:3": "680x1024"}
          2K: {"1:1": "1448x1448", "16:9": "1920x1088", "9:16": "1088x1920", "4:3": "1664x1248", "3:4": "1248x1664", "3:2": "1768x1176", "2:3": "1176x1768"}
        aliases: {"1920x1080": "1920x1088", "1080x1920": "1088x1920"}
      resolution: {options: ["1K", "2K"], default: "2K"}
      ratio: {options: ["1:1", "16:9", "9:16", "4:3", "3:4", "3:2", "2:3"], default: "9:16"}
      negativePrompt: false
      seed: false
      promptExtend: false
      watermark: false
    inputs:
      reference_images: {max: 10, reference_type: image}
  - id: jc-minimax-h3
    display_name: "MiniMax H3 · 本地"
    description: "文生、首帧图生与首尾帧视频，1–28 秒，via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [t2v, i2v]
    docs: {official_snapshot_ids: [jiucaihezi/videos], context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui:
      selection_group: i2v
      visible_in: [project_settings, series_settings, video_sidebar, global_settings]
      order: 1004
      recommended: true
      badges: [本地, MiniMax]
    duration: {type: slider, min: 1, max: 28, step: 1, default: 5}
    params:
      # 固定 1K 档位；面板只提交比例，后端换算实际像素。
      ratio:
        options: ["16:9", "9:16", "1:1", "4:3", "3:4", "3:2", "2:3"]
        default: "16:9"
        pixel_sizes: {"16:9": "1024x576", "9:16": "576x1024", "1:1": "1024x1024", "4:3": "1024x768", "3:4": "768x1024", "3:2": "960x640", "2:3": "640x960"}
        legacy_resolutions: {"1344x768": "16:9", "1024x576": "16:9", "576x1024": "9:16", "1024x1024": "1:1", "1024x768": "4:3", "768x1024": "3:4", "960x640": "3:2", "640x960": "2:3", "1920x1088": "16:9", "1088x1920": "9:16", "1440x1440": "1:1", "1664x1248": "4:3", "1248x1664": "3:4", "1760x1184": "3:2", "1184x1760": "2:3"}
      negativePrompt: false
      promptExtend: false
      audio: false
    inputs:
      reference_images: {max: 2, reference_type: image}
  - id: jc-minimax-h3-ref2v
    display_name: "MiniMax H3 Ref2V · 本地"
    description: "1–6 张参考图生成视频，1–28 秒，via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [r2v]
    docs: {official_snapshot_ids: [jiucaihezi/videos], context_hub_doc_ids: [jiucaihezi]}
