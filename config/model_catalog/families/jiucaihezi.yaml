  # 所以分组仍是 r2v；后面三个能力是给「只有韭菜盒子」的目录当全能模型兜底用的。
  # 固定 30 秒 / 720p、参考图 ≤9 张：这个家族的特判在 pipeline 的 seedance 分支与
  # 前端 VideoCreator 里（按 `seedance2.5` 子串匹配，两个通道都覆盖）。
  - id: 海seedance2.5
