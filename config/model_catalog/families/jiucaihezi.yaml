family: jiucaihezi
display_name: "韭菜盒子"
provider: jiucaihezi
routing_prefixes: ["jiucaihezi/"]
supported_backends: [jiucaihezi]
default_backend: jiucaihezi
credential_sources:
  jiucaihezi: [JIUCAIHEZI_API_KEY]
supported_modalities: [text, t2i, i2i, i2v]
docs:
  official_snapshot_ids: [jiucaihezi]
  context_hub_doc_ids: [jiucaihezi]
transport:
  image_input_mode: {jiucaihezi: jiucaihezi_url_or_multipart}
  audio_input_mode: {jiucaihezi: jiucaihezi_url}
  reference_video_input_mode: {jiucaihezi: jiucaihezi_url}
models:
  - id: claude-fable-5-1
    display_name: "Claude Fable 5.1 · 韭菜盒子"
    description: "Claude Fable 5.1 via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [text]
    docs: {official_snapshot_ids: [jiucaihezi/text], context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui: {selection_group: text, visible_in: [project_settings, series_settings, global_settings], order: 1000, recommended: false, badges: [韭菜盒子]}
  - id: claude-sonnet-5
    display_name: "Claude Sonnet 5 · 韭菜盒子"
    description: "Claude Sonnet 5 via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [text]
    docs: {official_snapshot_ids: [jiucaihezi/text], context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui: {selection_group: text, visible_in: [project_settings, series_settings, global_settings], order: 999, recommended: false, badges: [韭菜盒子]}
  - id: deepseek-flash
    display_name: "deepseek-flash"
    description: "deepseek-flash via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [text]
    docs: {official_snapshot_ids: [jiucaihezi/text], context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui: {selection_group: text, visible_in: [project_settings, series_settings, global_settings], order: 995, recommended: false, badges: [韭菜盒子]}
  - id: gemini-3.8-flash
    display_name: "Gemini 3.8 Flash · 韭菜盒子"
    description: "Gemini 3.8 Flash via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [text]
    docs: {official_snapshot_ids: [jiucaihezi/text], context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui: {selection_group: text, visible_in: [project_settings, series_settings, global_settings], order: 997, recommended: false, badges: [韭菜盒子]}
  - id: gpt-5.6-sol
    display_name: "GPT 5.6 Sol · 韭菜盒子"
    description: "GPT 5.6 Sol via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [text]
    docs: {official_snapshot_ids: [jiucaihezi/text], context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui: {selection_group: text, visible_in: [project_settings, series_settings, global_settings], order: 996, recommended: true, badges: [韭菜盒子]}
  - id: jiucaihezi/gpt-image-2.5-1k
    display_name: "GPT Image 2.5 1K · 韭菜盒子"
    description: "GPT Image 2.5 via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [t2i, i2i]
    docs: {official_snapshot_ids: [jiucaihezi/images], context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui:
      selection_group: image
      visible_in: [project_settings, series_settings, global_settings]
      order: 1000
      recommended: false
      badges: [韭菜盒子]
    params: &gpt_image_params_1k
      # 像素尺寸的事实源在前端 frontend/src/lib/imageSizePresets.ts（一张表管住 17 个比例
      # × 1K/2K/4K）。目录只声明「这个模型支持哪几档分辨率」，不要再把像素枚举一遍。
      # options 仅为旧版单下拉的兼容回退，新 UI 不看它。
      size:
        resolutions: ["1K"]
        options: ["1024x1024", "1536x1024", "1024x1536", "1024x768", "768x1024", "1024x576", "576x1024"]
        default: "1024x1024"
      negativePrompt: false
      seed: false
      promptExtend: false
      watermark: false
    # 上游 /v1/images/edits 最多接 16 张参考图。只声明在本模型上：同家族的
    # gemini / grok 是别的上游模型，上限各不相同，不能跟着锚点套。
    inputs:
      reference_images: {max: 16, reference_type: image}
  - id: jiucaihezi/gemini-3-pro-image-preview
    display_name: "Gemini 3 Pro Image · 韭菜盒子"
    description: "Gemini 3 Pro Image via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [t2i, i2i]
    docs: {official_snapshot_ids: [jiucaihezi/images], context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui:
      selection_group: image
      visible_in: [project_settings, series_settings, global_settings]
      order: 999
      recommended: false
      badges: [韭菜盒子]
    # gemini 自己的尺寸集，跟 GPT Image 2.5 的 17 比例表不同，所以不给它 resolutions，
    # 它会继续走旧的单下拉 UI。
    params:
      size:
        options: ["1024x1024", "1536x1024", "1024x1536", "2048x2048", "2048x1152", "1152x2048", "2048x1536", "1536x2048", "3840x2160", "2160x3840"]
        default: "1024x1024"
      negativePrompt: false
      seed: false
      promptExtend: false
      watermark: false
  # 2 系列（无 .5）：网关上是与 2.5 并存的独立通道。默认出图模型就是这里的
  # gpt-image-2-1k（见 catalog.meta.yaml 的 defaults.model_settings）。
  - id: jiucaihezi/gpt-image-2-1k
    display_name: "GPT Image 2 1K · 韭菜盒子"
    description: "GPT Image 2，固定 1K，via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [t2i, i2i]
    docs: {context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui: {selection_group: image, visible_in: [project_settings, series_settings, global_settings], order: 1002, recommended: true, badges: [韭菜盒子]}
    params: *gpt_image_params_1k
    inputs:
      reference_images: {max: 16, reference_type: image}
  # 菠萝通道的 2 系列：与 2.5-菠萝 同规格 —— 1K/2K/4K + 17 比例表 + 质量档。
  # 菠萝通道自身就支持选质量，质量档是**请求参数**（网关另有两个
  # `gpt-image-2-中质量` / `gpt-image-2-低质量`，那是把档位预设好的整包模型 id，
  # 跟这个参数不冲突 —— 别拿它们反推「这个模型不吃 quality」）。
  - id: jiucaihezi/gpt-image-2-菠萝
    display_name: "GPT Image 2 菠萝 · 韭菜盒子"
    description: "GPT Image 2 菠萝，1K/2K/4K + 质量档，via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [t2i, i2i]
    docs: {context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui: {selection_group: image, visible_in: [project_settings, series_settings, global_settings], order: 993, recommended: false, badges: [韭菜盒子]}
    params:
      size:
        resolutions: ["1K", "2K", "4K"]
        options: ["1024x1024", "1536x1024", "1024x1536", "1024x768", "768x1024", "1024x576", "576x1024"]
        default: "1024x1024"
      quality:
        options: ["high", "medium", "low"]
        default: "high"
      negativePrompt: false
      seed: false
      promptExtend: false
      watermark: false
    inputs:
      reference_images: {max: 16, reference_type: image}
  - id: jiucaihezi/gpt-image-2.5-菠萝
    display_name: "GPT Image 2.5 菠萝 · 韭菜盒子"
    description: "GPT Image 2.5 菠萝，1K/2K/4K + 质量档，via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [t2i, i2i]
    docs: {context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui: {selection_group: image, visible_in: [project_settings, series_settings, global_settings], order: 994, recommended: false, badges: [韭菜盒子]}
    params:
      # 1K/2K/4K + 17 比例表，外加质量档：这是本目录里第一个
      # 暴露 quality 的模型（网关接受 high/medium/low）。Playground 的 ParameterBar
      # 看到 quality 才渲染「质量」下拉；值经 playground service → JiucaiheziImageModel
      # 转给网关，三处缺一不可。
      size:
        resolutions: ["1K", "2K", "4K"]
        options: ["1024x1024", "1536x1024", "1024x1536", "1024x768", "768x1024", "1024x576", "576x1024"]
        default: "1024x1024"
      quality:
        options: ["high", "medium", "low"]
        default: "high"
      negativePrompt: false
      seed: false
      promptExtend: false
      watermark: false
    inputs:
      reference_images: {max: 16, reference_type: image}
  - id: jiucaihezi/grok-imagine-image-2.0
    display_name: "Grok Imagine Image 2.0 · 韭菜盒子"
    description: "Grok Imagine Image 2.0 via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [t2i, i2i]
    docs: {official_snapshot_ids: [jiucaihezi/grok-image-2], context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui: {selection_group: image, visible_in: [project_settings, series_settings, global_settings], order: 1001, recommended: false, badges: [韭菜盒子]}
    params:
      size:
        options: ["1024x1024", "1536x1024", "1024x1536", "2048x2048", "2048x1152", "1152x2048"]
        default: "1024x1024"
      negativePrompt: false
      seed: false
      promptExtend: false
      watermark: false
    inputs:
      reference_images: {max: 5, reference_type: image}
  # Seedance 2.5 的两个通道，id 就是网关上的模型名原文：
  #   海seedance2.5    —— 中文前缀不是拼写错误；目前是默认的 i2v/r2v 通道
  #   dola-seedance2.5 —— 2026-09-18 曾因任务频繁超时下线，2026-09-19 拿回可选
  # 能力顺序决定 capabilities[0]，但两条都有显式 ui.selection_group（优先级更高），
  # 所以分组仍是 r2v；后面三个能力是给「只有韭菜盒子」的目录当全能模型兜底用的。
  # 固定 30 秒 / 720p、参考图 ≤9 张：这个家族的特判在 pipeline 的 seedance 分支与
  # 前端 VideoCreator 里（按 `seedance2.5` 子串匹配，两个通道都覆盖）。
  - id: 海seedance2.5
    display_name: "Seedance 2.5 海 · 韭菜盒子"
    description: "文生 / 图生 / 参考生 / 编辑全能（海通道），via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [r2v, i2v, t2v, v2v]
    docs: {official_snapshot_ids: [jiucaihezi/videos], context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui:
      selection_group: r2v
      visible_in: [project_settings, series_settings, video_sidebar, global_settings]
      order: 999
      recommended: false
      badges: [韭菜盒子]
    duration: {type: fixed, value: 30}
    params:
      resolution: {options: [720p], default: 720p}
      ratio: {options: ["16:9", "9:16", "1:1", "3:4", "4:3", "21:9"], default: "16:9"}
    inputs:
      reference_images: {max: 9, reference_type: image}
  - id: dola-seedance2.5
    display_name: "Seedance 2.5 dola · 韭菜盒子"
    description: "文生 / 图生 / 参考生 / 编辑全能（dola 通道），via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [r2v, i2v, t2v, v2v]
    docs: {official_snapshot_ids: [jiucaihezi/videos], context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui:
      selection_group: r2v
      visible_in: [project_settings, series_settings, video_sidebar, global_settings]
      order: 1000
      recommended: false
      badges: [韭菜盒子]
    duration: {type: fixed, value: 30}
    params:
      resolution: {options: [720p], default: 720p}
      ratio: {options: ["16:9", "9:16", "1:1", "3:4", "4:3", "21:9"], default: "16:9"}
    inputs:
      reference_images: {max: 9, reference_type: image}
  - id: minimax_h3_image_audio_to_video_v2_15s
    display_name: "MiniMax H3 · 韭菜盒子"
    description: "图片/音频参考生视频及文生、图生、编辑全能，via 韭菜盒子"
    status: active
    release_stage: stable
    # 同 海seedance2.5：显式 selection_group 优先，分组仍是 r2v。
    capabilities: [r2v, i2v, t2v, v2v]
    docs: {official_snapshot_ids: [jiucaihezi/minimax-h3], context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui:
      selection_group: r2v
      visible_in: [project_settings, series_settings, video_sidebar, global_settings]
      order: 1001
      recommended: false
      badges: [韭菜盒子, MiniMax]
    duration: &minimax_h3_duration {type: slider, min: 1, max: 15, step: 1, default: 5}
    params: &minimax_h3_params
      # resolution 的 横/竖 后缀是横竖的唯一事实源，ratio 只是它的冗余表达。
      # 所以：UI 在有 横/竖 时不渲染「画面比例」；后端在两者矛盾时以 resolution 为准。
      resolution: {options: ["480p横", "768p横", "480p竖", "768p竖"], default: "768p横"}
      ratio: {options: ["16:9", "9:16"], default: "16:9"}
      negativePrompt: false
      promptExtend: false
      audio: true
    inputs: &minimax_h3_inputs
      reference_images: {max: 9, reference_type: image}
      reference_audio: {max: 3, reference_type: audio}
  - id: minimax_h3_zm_u24
    display_name: "MiniMax H3 zm-u24 · 韭菜盒子"
    description: "图片/音频参考生视频及文生、图生、编辑全能，via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [r2v, i2v, t2v, v2v]
    docs: {official_snapshot_ids: [jiucaihezi/minimax-h3], context_hub_doc_ids: [jiucaihezi]}
    runtime: {jiucaihezi: {gateway: jiucaihezi}}
    ui:
      selection_group: r2v
      visible_in: [project_settings, series_settings, video_sidebar, global_settings]
      order: 1002
      recommended: false
      badges: [韭菜盒子, MiniMax]
    # 与 minimax_h3_image_audio_to_video_v2_15s 同规格，用锚点锁死一致性：
    # 以后改那个模型的时长/分辨率/参考图上限，这个自动跟着变。
    duration: *minimax_h3_duration
    params: *minimax_h3_params
    inputs: *minimax_h3_inputs
