    ui:
      selection_group: r2v
      visible_in: [project_settings, series_settings, video_sidebar, global_settings]
      order: 1005
      recommended: true
      badges: [本地, MiniMax]
    duration: {type: slider, min: 1, max: 28, step: 1, default: 3}
    params:
      ratio: {options: ["16:9", "9:16", "1:1", "4:3", "3:4", "3:2", "2:3", "21:9"], default: "16:9"}
      negativePrompt: false
      promptExtend: false
      audio: false
    inputs:
      reference_images: {max: 6, reference_type: image}
  - id: dola-seedance2.5
    display_name: "Seedance 2.5 dola · 韭菜盒子"
    description: "文生 / 图生 / 参考生 / 编辑全能（dola 通道），via 韭菜盒子"
    status: active
    release_stage: stable
    capabilities: [r2v, i2v, t2v, v2v]
