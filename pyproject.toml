[tool.black]
line-length = 100
target-version = ['py311']
skip-string-normalization = false
exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", ".venv", "venv", "build", "dist"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
# src/ 下也散着测试文件（`src/apps/**/test_*.py`、`src/models/test_*.py`）。
# 只收 tests/ 的话它们不会被收集，等于长期静默不跑 —— 曾经因此漏掉 73 个测试。
# 这类 in-tree 测试依赖 `src/apps/__init__.py` 才能按 src.apps.* 的包名导入，
# 缺了那个文件会导致相对导入越界、整个 run 直接中断。
testpaths = ["tests", "src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
